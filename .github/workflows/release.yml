name: Build Release

on:
  push:
    branches:
      - master

jobs:
  build:
    #	配置权限
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 21"
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          java-package: jdk
          architecture: x64
          cache: gradle
      - name: "Set up JDK 25"
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk
          architecture: x64
      - name: "Build with Gradle"
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar -PBuildFull=false
          ./gradlew shadowJar -PBuildFull=true
      - name: "Stage"
        run: |
          mkdir -p staging
          mv build/libs/*.jar staging/
      - name: "Get Tag"
        id: get_tag
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: staging/

